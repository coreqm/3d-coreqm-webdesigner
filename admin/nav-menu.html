<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 3D Coreqm Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#090b10">
  <title>Menü Yönetimi — 3D Coreqm Admin</title>
  
  <link rel="stylesheet" href="/css/output.css">
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Store & MVVM Layers -->
  <script src="../store.js"></script>
  <script src="js/components/webp-helper.js"></script>
  <script src="js/components/admin-sidebar.js"></script>
  <script src="js/components/admin-header.js"></script>

  <script src="js/models/user.model.js"></script>
  <script src="js/models/settings.model.js"></script>
  <script src="js/viewmodels/nav-menu.viewmodel.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: -0.01em; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
  </style>
</head>
<body class="h-screen overflow-hidden bg-[#f8fafc] dark:bg-[#090b10] text-neutral-800 dark:text-slate-100 flex flex-col transition-colors duration-200">

  <div class="flex-1 flex h-full overflow-hidden">
    <div id="sidebar-container" class="flex-shrink-0 h-full"></div>

    <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar">
      <div id="header-container"></div>

      <main class="p-6 md:p-8 flex-1 max-w-7xl w-full mx-auto space-y-8">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl sm:text-3xl font-bold text-neutral-900 dark:text-white tracking-tight">Menü Yönetimi</h2>
            <p class="text-sm text-neutral-500 dark:text-zinc-400 mt-1 font-normal">Üst header çubuğundaki gezinme linkleri, sıralamalar ve rozetler.</p>
          </div>
          <button onclick="NavMenuViewModel.openNewModal()" class="px-5 py-2.5 rounded-xl bg-[#4f46e5] hover:bg-[#4338ca] text-white font-medium text-sm flex items-center gap-2 shadow-xs transition-colors self-start sm:self-auto">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>+ Yeni Menü Öğesi</span>
          </button>
        </div>

        <div class="bg-white dark:bg-[#12141a] rounded-2xl border border-neutral-200/90 dark:border-zinc-800 shadow-2xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-neutral-200/80 dark:border-zinc-800">
                  <th class="py-4 pl-8 pr-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">SIRA</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">BAŞLIK (TR)</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">BAŞLIK (EN)</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">HEDEF URL</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 text-center">ROZET</th>
                  <th class="py-4 pl-4 pr-8 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 text-right">İŞLEMLER</th>
                </tr>
              </thead>
              <tbody id="navMenuTableBody" class="divide-y divide-neutral-100 dark:divide-zinc-800/60">
                <!-- Dinamik satırlar -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

      </div>
  </div>

  <!-- Menu Modal -->
  <div id="menuModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#12141a] border border-neutral-200 dark:border-zinc-800 w-full max-w-lg rounded-3xl p-6 sm:p-8 shadow-2xl text-neutral-900 dark:text-white">
      <div class="flex items-center justify-between pb-4 border-b border-neutral-100 dark:border-zinc-800 mb-6">
        <h3 id="menuModalTitle" class="text-base font-bold">Yeni Menü Öğesi</h3>
        <button onclick="NavMenuViewModel.closeModal()" class="text-neutral-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="menuForm" class="space-y-4">
        <input type="hidden" id="menu_id">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1">Başlık (TR) *</label>
            <input type="text" id="menu_title_tr" required class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-xs outline-none">
          </div>
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1">Başlık (EN)</label>
            <input type="text" id="menu_title_en" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-xs outline-none">
          </div>
        </div>
        <div>
          <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1">Hedef URL *</label>
          <input type="text" id="menu_url" required placeholder="#katalog veya /sayfa" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-xs outline-none font-mono">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1">Sıralama No</label>
            <input type="number" id="menu_order" value="0" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-xs outline-none font-mono">
          </div>
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1">Rozet Metni (Opsiyonel)</label>
            <input type="text" id="menu_badge" placeholder="Yeni, Canlı..." class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-xs outline-none">
          </div>
        </div>
        <input type="hidden" id="menu_new_tab" value="0">

        <div class="mt-8 pt-4 border-t border-neutral-100 dark:border-zinc-800 flex justify-end gap-3">
          <button type="button" onclick="NavMenuViewModel.closeModal()" class="px-5 py-2.5 rounded-xl border border-neutral-200 dark:border-zinc-700 text-xs font-medium">İptal</button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-[#4f46e5] text-white font-bold text-xs uppercase shadow-md">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      NavMenuViewModel.init();
    });
  </script>
</body>
</html>
