<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 3D Coreqm Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#090b10">
  <title>Ürün Kataloğu (CRUD) — 3D Coreqm Admin</title>
  
  <link rel="stylesheet" href="/css/output.css">
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Store & MVVM Layers -->
  <script src="../store.js"></script>
  <script src="js/components/webp-helper.js"></script>
  <script src="js/components/admin-sidebar.js"></script>
  <script src="js/components/admin-header.js"></script>

  <script src="js/models/user.model.js"></script>
  <script src="js/models/product.model.js"></script>
  <script src="js/models/frame.model.js"></script>
  <script src="js/viewmodels/products.viewmodel.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: -0.01em; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
  </style>
</head>
<body class="h-screen overflow-hidden bg-[#f8fafc] dark:bg-[#090b10] text-neutral-800 dark:text-slate-100 flex flex-col transition-colors duration-200">

  <div class="flex-1 flex h-full overflow-hidden">
    <!-- Shared Sidebar -->
    <div id="sidebar-container" class="flex-shrink-0 h-full"></div>

    <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar">
      <!-- Shared Header -->
      <div id="header-container"></div>

      <main class="p-6 md:p-8 flex-1 max-w-7xl w-full mx-auto space-y-8">
        
        <!-- Üst Başlık & Aksiyon -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl sm:text-3xl font-bold text-neutral-900 dark:text-white tracking-tight">Ürün Kataloğu (CRUD)</h2>
            <p class="text-sm text-neutral-500 dark:text-zinc-400 mt-1 font-normal">E-ticaret ürünlerini ekleyin, düzenleyin veya kaldırın.</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="relative">
              <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 dark:text-zinc-500"></i>
              <input type="text" id="searchProductInput" placeholder="Ürün ara..." class="pl-9 pr-4 py-2 rounded-xl bg-white dark:bg-[#12141a] border border-neutral-200 dark:border-zinc-800 text-xs text-neutral-800 dark:text-zinc-200 placeholder-neutral-400 outline-none focus:border-indigo-500 transition-colors shadow-2xs">
            </div>
            <button onclick="ProductsViewModel.openNewModal()" class="px-5 py-2.5 rounded-xl bg-[#4f46e5] hover:bg-[#4338ca] text-white font-medium text-sm flex items-center gap-2 shadow-xs transition-colors">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>+ Yeni Ürün Ekle</span>
            </button>
          </div>
        </div>

        <!-- Ürün Tablosu Kartı (media_1787864991151.png estetiğinde) -->
        <div class="bg-white dark:bg-[#12141a] rounded-2xl border border-neutral-200/90 dark:border-zinc-800 shadow-2xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-neutral-200/80 dark:border-zinc-800">
                  <th class="py-4 pl-8 pr-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">ID</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">GÖRSEL</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">ÜRÜN ADI</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">KATEGORİ</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">FİYAT</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 text-center">3D DURUMU</th>
                  <th class="py-4 pl-4 pr-8 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 text-right">İŞLEMLER</th>
                </tr>
              </thead>
              <tbody id="productTableBody" class="divide-y divide-neutral-100 dark:divide-zinc-800/60">
                <!-- Dinamik satırlar -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

      </div>
  </div>

  <!-- Product Modal (WebP Destekli) -->
  <div id="productModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#12141a] border border-neutral-200 dark:border-zinc-800 w-full max-w-xl rounded-3xl p-6 sm:p-8 shadow-2xl text-neutral-900 dark:text-white max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex items-center justify-between pb-4 border-b border-neutral-100 dark:border-zinc-800 mb-6">
        <div>
          <span class="font-mono text-[10px] uppercase tracking-widest text-neutral-400 dark:text-zinc-500">3D Coreqm KATALOG</span>
          <h3 id="productModalTitle" class="text-base font-bold text-neutral-900 dark:text-white mt-0.5">Yeni Ürün Ekle</h3>
        </div>
        <button onclick="ProductsViewModel.closeModal()" class="text-neutral-400 hover:text-neutral-900 dark:text-zinc-400 dark:hover:text-white transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="productForm" class="space-y-4">
        <input type="hidden" id="prod_id">

        <div>
          <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1.5">Ürün Adı *</label>
          <input type="text" id="prod_title" required placeholder="Örn: 3D Coreqm Sphere Pro" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs text-neutral-900 dark:text-white outline-none focus:border-indigo-500 font-sans">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1.5">Fiyat ($ USD) *</label>
            <input type="number" step="0.01" id="prod_price" required placeholder="149.00" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs text-neutral-900 dark:text-white outline-none focus:border-indigo-500 font-mono">
          </div>
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1.5">Kategori *</label>
            <input type="text" id="prod_category" required placeholder="Örn: 3D Donanım, Aksesuar" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs text-neutral-900 dark:text-white outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1.5">Açıklama</label>
          <textarea id="prod_desc" rows="2" placeholder="Ürün özelliklerini kısaca açıklayın..." class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2 text-xs text-neutral-900 dark:text-white outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1.5">3D Durumu</label>
            <select id="prod_has_3d" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs text-neutral-900 dark:text-white outline-none">
              <option value="1">360° Aktif (Kare Dizilimi)</option>
              <option value="0">Statik Görsel</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase mb-1.5">360 Kare Seti</label>
            <select id="prod_frame_folder" class="w-full bg-white dark:bg-[#181b22] border border-neutral-300 dark:border-zinc-700 rounded-xl px-4 py-2.5 text-xs text-neutral-900 dark:text-white outline-none">
              <!-- Dinamik doldurulur -->
            </select>
          </div>
        </div>

        <!-- Otomatik WebP Görsel Seçici -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-mono text-neutral-700 dark:text-zinc-300 uppercase">Ürün Görseli (Otomatik WebP)</label>
            <span id="prod_webp_badge" class="hidden text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-500 border border-emerald-500/20"></span>
          </div>
          <div class="flex items-center gap-3">
            <input type="file" id="prod_image_file" accept="image/*" class="w-full text-xs text-neutral-500 dark:text-zinc-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-neutral-100 dark:file:bg-zinc-800 file:text-neutral-700 dark:file:text-zinc-300 hover:file:bg-neutral-200 cursor-pointer">
            <img id="prod_image_preview" class="w-10 h-10 rounded-lg object-contain bg-black border border-neutral-200 dark:border-zinc-700 hidden" alt="Önizleme">
          </div>
          <input type="hidden" id="prod_image">
        </div>

        <div class="mt-8 pt-4 border-t border-neutral-100 dark:border-zinc-800 flex justify-end gap-3">
          <button type="button" onclick="ProductsViewModel.closeModal()" class="px-5 py-2.5 rounded-xl border border-neutral-200 dark:border-zinc-700 hover:bg-neutral-100 dark:hover:bg-zinc-800 text-xs font-medium text-neutral-700 dark:text-zinc-300 transition-colors">
            İptal
          </button>
          <button type="submit" class="px-6 py-2.5 rounded-xl bg-[#4f46e5] hover:bg-[#4338ca] font-bold text-xs text-white uppercase tracking-wider transition-colors shadow-md">
            Ürünü Kaydet
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      ProductsViewModel.init();
    });
  </script>
</body>
</html>
