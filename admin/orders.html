<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 3D Coreqm Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#090b10">
  <title>Sipariş Yönetimi — 3D Coreqm Admin</title>
  
  <link rel="stylesheet" href="/css/output.css">
  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Store & MVVM Layers -->
  <script src="../store.js"></script>
  <script src="js/components/webp-helper.js"></script>
  <script src="js/components/admin-sidebar.js"></script>
  <script src="js/components/admin-header.js"></script>

  <script src="js/models/user.model.js"></script>
  <script src="js/models/order.model.js"></script>
  <script src="js/viewmodels/orders.viewmodel.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif; letter-spacing: -0.01em; }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 9999px; }
  </style>
</head>
<body class="h-screen overflow-hidden bg-[#f8fafc] dark:bg-[#090b10] text-neutral-800 dark:text-slate-100 flex flex-col transition-colors duration-200">

  <div class="flex-1 flex h-full overflow-hidden">
    <div id="sidebar-container" class="flex-shrink-0 h-full"></div>

    <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto custom-scrollbar">
      <div id="header-container"></div>

      <main class="p-6 md:p-8 flex-1 max-w-7xl w-full mx-auto space-y-8">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h2 class="text-2xl sm:text-3xl font-bold text-neutral-900 dark:text-white tracking-tight">Sipariş Yönetimi</h2>
            <p class="text-sm text-neutral-500 dark:text-zinc-400 mt-1 font-normal">Gelen siparişleri, kargo süreçlerini ve faturaları yönetin.</p>
          </div>
        </div>

        <!-- Siparişler Tablosu -->
        <div class="bg-white dark:bg-[#12141a] rounded-2xl border border-neutral-200/90 dark:border-zinc-800 shadow-2xs overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-neutral-200/80 dark:border-zinc-800">
                  <th class="py-4 pl-8 pr-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">SİPARİŞ #</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">MÜŞTERİ / ADRES</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">ÜRÜNLER</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500">TUTAR</th>
                  <th class="py-4 px-4 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 text-center">DURUM</th>
                  <th class="py-4 pl-4 pr-8 text-[11px] font-bold uppercase tracking-wider text-slate-400 dark:text-zinc-500 text-right">İŞLEMLER</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody" class="divide-y divide-neutral-100 dark:divide-zinc-800/60">
                <!-- Dinamik satırlar -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

      </div>
  </div>

  <!-- Invoice Modal -->
  <div id="invoiceModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white dark:bg-[#12141a] border border-neutral-200 dark:border-zinc-700 w-full max-w-xl rounded-3xl p-6 sm:p-8 shadow-2xl text-neutral-900 dark:text-white max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      <div class="flex items-center justify-between pb-4 border-b border-neutral-100 dark:border-zinc-800 mb-6">
        <div>
          <span class="font-mono text-[10px] uppercase tracking-widest text-neutral-400 dark:text-zinc-500">3D Coreqm INVOICE</span>
          <h3 id="invModalId" class="text-base font-bold text-neutral-900 dark:text-white mt-0.5">Sipariş Faturası</h3>
        </div>
        <button onclick="OrdersViewModel.closeInvoiceModal()" class="text-neutral-400 hover:text-neutral-900 dark:text-zinc-400 dark:hover:text-white transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="invoiceModalContent" class="space-y-4 text-xs font-mono text-neutral-700 dark:text-zinc-300"></div>

      <div class="mt-8 pt-4 border-t border-neutral-100 dark:border-zinc-800 flex justify-end gap-3">
        <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-neutral-100 dark:bg-zinc-800 hover:bg-neutral-200 dark:hover:bg-zinc-700 text-xs font-medium text-neutral-700 dark:text-zinc-200 flex items-center gap-1.5 transition-colors">
          <i data-lucide="printer" class="w-3.5 h-3.5"></i> <span>Yazdır</span>
        </button>
        <button onclick="OrdersViewModel.closeInvoiceModal()" class="px-6 py-2 rounded-xl bg-[#4f46e5] hover:bg-[#4338ca] font-bold text-xs text-white uppercase transition-colors shadow-md">
          Kapat
        </button>
      </div>

    </div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      OrdersViewModel.init();
    });
  </script>
</body>
</html>
