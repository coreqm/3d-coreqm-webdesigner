<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="8"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="#4f46e5" opacity="0.18" filter="url(#glow)"/>

  <!-- 3D Isometric Cube / Core Geometry -->
  <g transform="translate(256, 256) scale(1.1)">
    <!-- Top Face -->
    <path d="M 0 -100 L 86.6 -50 L 0 0 L -86.6 -50 Z" fill="url(#primaryGrad)" opacity="0.95" />
    
    <!-- Left Face -->
    <path d="M -86.6 -50 L 0 0 L 0 100 L -86.6 50 Z" fill="#312e81" opacity="0.9" />
    
    <!-- Right Face -->
    <path d="M 0 0 L 86.6 -50 L 86.6 50 L 0 100 Z" fill="#1e1b4b" opacity="0.95" />

    <!-- Inner Core Orb -->
    <circle cx="0" cy="0" r="28" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
  </g>

  <!-- 3D Text Overlay Badge -->
  <text x="256" y="445" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="54" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    3D COREQM
  </text>
</svg>